# Binvia Release：打 v* tag（或手动触发）→ 构建 universal 产物 → 发布 GitHub Release。
# 版本号以 tag 为准（v0.1.0 → MARKETING_VERSION=0.1.0），并覆盖 version.env。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.1.0），仅手动触发时使用；tag 触发时以 tag 为准"
        required: true
        default: "0.1.0"

# 允许 gh release create 写 Releases
permissions:
  contents: write

jobs:
  release:
    name: universal 构建 + 发布
    # macos-26（arm64 + SDK 26）：与本机开发环境一致，避免 SwiftUI 视觉差异
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macos-26 镜像自带 Xcode 26.5（Swift 6.3 + SDK 26），与本机一致，无需安装工具链
      - name: Cache SwiftPM 构建缓存
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-macos26-release-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: 版本号以 tag / 手动输入为准（覆盖 version.env）
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"    # v0.1.0 -> 0.1.0
          fi
          printf 'MARKETING_VERSION=%s\nBUILD_NUMBER=%s\n' "$VERSION" "${{ github.run_number }}" > version.env
          cat version.env

      # 双架构（arm64 + x86_64）构建 + 647 项测试 + smoke-test + adhoc 签名 + tar.gz
      - name: 构建 universal 产物
        run: ./Scripts/build.sh

      - name: 校验产物
        run: |
          cd bin
          ls -lh
          lipo -info BinviaApp
          cat SHA256SUMS

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TAG="v${VERSION}"
          NOTES=/tmp/release-notes.md
          echo "Binvia ${VERSION}（macOS universal：Apple Silicon + Intel）" > "$NOTES"
          echo "" >> "$NOTES"
          echo "## 下载与安装" >> "$NOTES"
          echo "- **Binvia-${VERSION}-macos-arm64-x86_64.dmg（推荐）**：打开后把 Binvia.app 拖入 Applications 即可" >> "$NOTES"
          echo "- Binvia-${VERSION}-macos-arm64-x86_64.tar.gz：免安装版（解压即用）" >> "$NOTES"
          echo "- install-cli.sh：命令行工具安装脚本（可选，见下方命令）" >> "$NOTES"
          echo "- SHA256SUMS：校验和" >> "$NOTES"
          echo "" >> "$NOTES"
          echo "## 可选：安装命令行工具（BinviaServer / BinviaCLI）" >> "$NOTES"
          echo "日常使用只需 GUI 应用；无头部署或终端操作用到命令行工具时执行：" >> "$NOTES"
          echo "" >> "$NOTES"
          echo '```bash' >> "$NOTES"
          echo 'curl -fsSL https://github.com/wangbin3162/Binvia/releases/latest/download/install-cli.sh | bash' >> "$NOTES"
          echo '```' >> "$NOTES"
          echo "" >> "$NOTES"
          echo "## 构建信息" >> "$NOTES"
          echo "- 构建：GitHub Actions 自动完成（构建 → BinviaCheck 647 项断言 → GUI 无界面自检）" >> "$NOTES"
          echo "- 签名：当前为 adhoc 签名（未经 Apple 公证），首次打开若被拦截请右键 → 打开 → 确认" >> "$NOTES"
          gh release create "$TAG" \
            "bin/Binvia-${VERSION}-macos-arm64-x86_64.dmg" \
            "bin/Binvia-${VERSION}-macos-arm64-x86_64.tar.gz" \
            "${{ github.workspace }}/Scripts/install-cli.sh" \
            bin/SHA256SUMS \
            --title "Binvia ${VERSION}" \
            --notes-file "$NOTES"
